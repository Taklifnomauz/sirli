<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For You — Magic Name</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#090610;color:#fff;font-family:Georgia,serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#281126 0,#130b1b 52%,#080610 100%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.ui{position:relative;z-index:2;min-height:100svh;width:100%;display:flex;align-items:center;justify-content:center;padding:22px}
.controls{position:fixed;z-index:5;top:22px;right:22px;display:flex;gap:10px}
.pill{border:1px solid #a989a866;background:#130d1dbb;color:#eee0eb;border-radius:30px;padding:11px 19px;font:600 11px Arial;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(8px)}
.pill.active{border-color:#d9a36d;color:#ffe0b5;box-shadow:0 0 17px #ffbb7433}
.scene{width:min(92vw,620px);height:min(82svh,780px);position:relative;display:flex;align-items:center;justify-content:center}
#fx{position:absolute;inset:0;width:100%;height:100%}
.envelope{position:absolute;width:min(88%,510px);aspect-ratio:1.8;opacity:0;transform:scale(.82);transition:opacity .8s,transform .8s;filter:drop-shadow(0 0 12px #ffc06b99)}
.envelope.show{opacity:1;transform:scale(1)}
.envbody{position:absolute;inset:0;border:3px solid #ffd18a;border-radius:5px;background:linear-gradient(140deg,#42262b,#1c1421 55%,#7c4d43);box-shadow:inset 0 0 25px #ffc47744}
.envbody:before,.envbody:after{content:"";position:absolute;inset:0}
.envbody:before{background:linear-gradient(35deg,transparent 49.5%,#ffdc9c 50%,transparent 50.7%),linear-gradient(-35deg,transparent 49.5%,#ffdc9c 50%,transparent 50.7%)}
.envbody:after{background:linear-gradient(145deg,transparent 49.5%,#ffc978 50%,transparent 50.8%),linear-gradient(-145deg,transparent 49.5%,#ffc978 50%,transparent 50.8%)}
.envflap{position:absolute;inset:0;background:linear-gradient(145deg,#ffe2a5,#b57a56);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform 1s;z-index:2}
.envheart{position:absolute;z-index:3;top:40%;left:50%;transform:translate(-50%,-50%);font-size:clamp(30px,6vw,54px);color:#ff5d9a;text-shadow:0 0 14px #ff418e}
.envwords{position:absolute;z-index:3;top:58%;width:100%;text-align:center;font:bold clamp(25px,6vw,48px) Arial;color:#fff2d0;text-shadow:0 0 10px #fff1b9;letter-spacing:3px}
.envelope.open .envflap{transform:rotateX(180deg);opacity:.4}
.scriptname{position:absolute;z-index:2;top:48%;width:100%;text-align:center;opacity:0;transform:translateY(15px);transition:opacity 1.2s,transform 1.2s;color:#ffb5c9;font-size:clamp(44px,11vw,88px);font-style:italic;text-shadow:0 0 10px #ff6a9c,0 0 24px #f37aa5}
.scriptname.show{opacity:1;transform:none}
.bottomname{position:absolute;z-index:2;bottom:8%;width:100%;text-align:center;color:#ffb6ca;font-size:clamp(31px,8vw,66px);font-style:italic;text-shadow:0 0 10px #ff679b,0 0 24px #ff347d;opacity:0;transition:opacity 1s}
.bottomname.show{opacity:1}
.entry{position:fixed;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,540px);display:flex;gap:8px;justify-content:center}
.entry{justify-content:center}
.entry button{border:1px solid #d6a06b;border-radius:28px;background:linear-gradient(110deg,#71374f,#2a1824);color:#ffe0b5;padding:14px 30px;letter-spacing:2px;font:600 11px Arial;cursor:pointer;box-shadow:0 0 18px #ffb66b22}
@media(max-height:650px){.scene{height:74svh}.controls{top:10px;right:10px}.entry{bottom:8px}}

.controls{gap:7px}.controls .pill{padding:10px 13px;font-size:10px}
.personal-message{position:absolute;z-index:3;bottom:1.5%;left:5%;right:5%;text-align:center;color:#eac9d7;font:12px Arial,sans-serif;letter-spacing:1.2px;line-height:1.5;opacity:0;transition:opacity 1s;text-shadow:0 0 9px #ff5c96}
.personal-message.show{opacity:1}
.brand-mark{position:absolute;z-index:3;left:50%;top:77%;transform:translateX(-50%);white-space:nowrap;color:#f6d5e6;font:600 12px Arial,sans-serif;letter-spacing:5px;text-shadow:0 0 8px #ff78ad,0 0 22px #ff4c93;opacity:0;transition:opacity 1.2s}
.brand-mark.show{opacity:.95}
.generator-panel{position:fixed;inset:0;z-index:20;background:#07050ddf;backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}
.generator-card{position:relative;width:min(100%,440px);max-height:90svh;overflow:auto;border:1px solid #a77d8c88;border-radius:22px;padding:24px 20px;background:linear-gradient(145deg,#241426,#100c18);box-shadow:0 0 45px #ff6b9d22;display:grid;gap:10px}
.gen-title{font:600 13px Arial,sans-serif;letter-spacing:3px;color:#ffd4a0;text-align:center;margin:4px 0 10px}
.generator-card label{font:11px Arial,sans-serif;letter-spacing:1.5px;color:#d7c4d4;margin-top:5px}
.generator-card input,.generator-card textarea{border:1px solid #8b647b88;border-radius:12px;background:#100b18;color:#fff;padding:13px;font:14px Arial,sans-serif;width:100%;outline:none}
.generator-card textarea{min-height:75px;resize:vertical}
.gen-options{display:flex;gap:8px}.gen-options .pill{flex:1}
.gen-create{border:1px solid #d6a06b;border-radius:25px;background:linear-gradient(110deg,#71374f,#44243c);color:#ffe0b5;padding:14px 17px;letter-spacing:2px;font:600 11px Arial,sans-serif;cursor:pointer;margin-top:8px}
.gen-create.secondary{background:#201523}
.close-gen{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#f8dbe7;font-size:28px;cursor:pointer}
.generated-wrap{display:grid;gap:8px;border-top:1px solid #8b647b66;padding-top:14px;margin-top:5px}
.generated-caption{font:10px Arial,sans-serif;letter-spacing:1.5px;color:#c7adbf;text-align:center}
.hidden{display:none!important}
@media(max-width:430px){.controls .pill{padding:9px 10px;letter-spacing:1.5px}.generator-card{padding:22px 16px}}


.controls{left:50%;right:auto;transform:translateX(-50%);top:16px;width:max-content;max-width:96vw;gap:8px;flex-wrap:wrap;justify-content:center}
.controls .pill{font-size:10px;padding:12px 15px;letter-spacing:1.7px}
.entry{bottom:20px;width:min(94vw,570px);justify-content:center}
.entry button{padding:14px 30px;font-size:11px}
.generator-panel{position:fixed;inset:0;z-index:20;background:#07050de8;backdrop-filter:blur(13px);display:grid;place-items:center;padding:16px}
.generator-card{position:relative;width:min(100%,500px);max-height:90svh;overflow:auto;border:1px solid #d1a47788;border-radius:25px;padding:30px 25px 24px;background:linear-gradient(145deg,#2b172b,#100b18 75%);box-shadow:0 0 55px #ff6b9d35;display:grid;gap:12px}
.gen-title{font:600 14px Arial,sans-serif;letter-spacing:2.5px;color:#ffdfb8;text-align:center;margin:2px 0 12px}
.generator-card label{font:12px Arial,sans-serif;letter-spacing:.7px;color:#ead4e3;margin-top:5px}
.generator-card input,.generator-card textarea{border:1px solid #b58b9e88;border-radius:14px;background:#100b18;color:#fff;padding:15px;font:15px Arial,sans-serif;width:100%;outline:none}
.generator-card input:focus,.generator-card textarea:focus{border-color:#ffc78b;box-shadow:0 0 15px #ffbd7133}
.generator-card textarea{min-height:92px;resize:vertical;line-height:1.5}
.gen-options{display:flex;gap:10px}.gen-options .pill{flex:1;padding:13px 8px}
.gen-create{border:1px solid #e0b17a;border-radius:28px;background:linear-gradient(110deg,#8d4666,#4b2948);color:#fff0d7;padding:16px 18px;letter-spacing:1.5px;font:600 12px Arial,sans-serif;cursor:pointer;margin-top:8px;box-shadow:0 5px 22px #ff6b9d22}
.gen-create:active{transform:scale(.98)}
.gen-create.secondary{background:#241729}
.close-gen{position:absolute;right:16px;top:12px;border:0;background:transparent;color:#f8dbe7;font-size:31px;cursor:pointer}
.generated-wrap{display:grid;gap:10px;border-top:1px solid #b58b9e55;padding-top:17px;margin-top:7px}
.generated-caption{font:11px Arial,sans-serif;letter-spacing:.7px;color:#d7bed0;text-align:center;line-height:1.5}
#generatedUrl{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.personal-message{font-size:clamp(12px,2.7vw,16px);bottom:1%;letter-spacing:.6px;padding:0 12px}
.brand-mark{top:79%;font-size:11px;letter-spacing:4px}
@media(max-width:480px){.controls{top:9px;gap:5px}.controls .pill{padding:10px 11px;font-size:9px;letter-spacing:1px}.scene{height:78svh}.entry{bottom:12px}.generator-card{padding:28px 18px 20px}}

</style></head><body>
<canvas id="stars"></canvas>
<div class="controls"><button class="pill" id="openGenerator">✦ LINK YARATISH</button><button class="pill active" id="ascii">NUQTALAR</button><button class="pill" id="voice">♫ MUSIQA</button></div>
<div class="ui"><div class="scene" id="scene">
<canvas id="fx"></canvas>
<div class="envelope" id="envelope"><div class="envbody"></div><div class="envflap"></div><div class="envheart">♥</div><div class="envwords">FOR YOU</div></div>
<div class="scriptname" id="scriptname">Mirabbos</div><div class="bottomname" id="bottomname">Mirabbos</div><div class="brand-mark" id="brandMark">AL-QAMIR</div><div id="personalMessage" class="personal-message"></div>
</div></div>
<div class="entry"><button id="replay">QAYTADAN</button></div>

<div id="generatorPanel" class="generator-panel hidden" role="dialog" aria-modal="true" aria-label="Shaxsiy havola yaratish">
 <div class="generator-card">
  <button id="closeGenerator" class="close-gen" aria-label="Yopish">×</button>
  <div class="gen-title">✦ SHAXSIY SOVG‘A YARATISH ✦</div>
  <label for="genName">Kimga yubormoqchisiz? Ismini yozing</label>
  <input id="genName" maxlength="32" placeholder="Masalan: Madina">
  <label for="genMessage">Unga atalgan xabar</label>
  <textarea id="genMessage" maxlength="220" placeholder="Yurakdan chiqqan so‘zlaringiz...">Bu gul aynan sen uchun ❤️</textarea>
  <label>Animatsiya ko‘rinishi</label>
  <div class="gen-options">
   <button type="button" class="pill active" data-mode="dots">✧ NUQTALAR</button>
   <button type="button" class="pill" data-mode="ascii"># % ^ 0 1</button>
  </div>
  <button id="createLink" class="gen-create">HAVOLA YARATISH ✦</button>
  <div id="generatedWrap" class="generated-wrap hidden">
   <div class="generated-caption">TAYYOR SHAXSIY HAVOLA</div>
   <input id="generatedUrl" readonly aria-label="Tayyor havola">
   <button id="copyLink" class="gen-create secondary">HAVOLANI NUSXALASH</button>
   <div id="copyStatus" class="generated-caption">Havolani nusxalab, Telegram yoki Instagram orqali yuboring.</div>
  </div>
 </div>
</div>
<audio id="bgMusic" loop preload="none" src="music.mp3"></audio>

<script>
const $ = id => document.getElementById(id);
const starCanvas=$('stars'), fx=$('fx'), sctx=starCanvas.getContext('2d'), ctx=fx.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1,mode='dots',phase=0,raf=0,stageTimers=[];
let stars=[],audioContext=null,oscillator=null,gainNode=null;
function sizeCanvas(){
 const rect=fx.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
 starCanvas.width=Math.round(W*dpr);starCanvas.height=Math.round(H*dpr);
 fx.width=Math.max(1,Math.round(rect.width*dpr));fx.height=Math.max(1,Math.round(rect.height*dpr));
 sctx.setTransform(dpr,0,0,dpr,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:260},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.6,p:Math.random()*6.28}));
}
function dims(){let r=fx.getBoundingClientRect();return {w:r.width,h:r.height,cx:r.width/2,cy:r.height*.43}}
function drawStars(t){sctx.clearRect(0,0,W,H);for(const p of stars){sctx.globalAlpha=.24+.62*(.5+.5*Math.sin(t*.001+p.p));sctx.fillStyle='#f0e5ff';sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,Math.PI*2);sctx.fill()}sctx.globalAlpha=1}
function drawGalaxy(t){
 const {w,h,cx,cy}=dims(),max=Math.min(w,h)*.36;ctx.save();ctx.translate(cx,cy);
 // Multi-arm spiral with a dense luminous core.
 for(let i=0;i<1700;i++){
  const arm=i%5, u=Math.random; // deterministic positions below
  const q=i/1700, a=q*Math.PI*13+arm*Math.PI*2/5+t*.00022*(i%2?1:-1);
  const r=5+q*max, spread=(Math.sin(i*91.7)*.5)*9;
  const x=Math.cos(a)*(r+spread)*1.12,y=Math.sin(a)*(r+spread)*.56;
  const alpha=.25+.65*(.5+.5*Math.sin(i+t*.003));
  ctx.fillStyle=i%17===0?'#fff4df':(i%4===0?`rgba(255,174,209,${alpha})`:`rgba(255,62,139,${alpha})`);
  ctx.shadowBlur=mode==='dots'?11:0;ctx.shadowColor='#ff4c93';
  if(mode==='ascii'){ctx.font='10px monospace';ctx.fillText(['#','%','^','0','1','@'][i%6],x,y)}
  else{ctx.beginPath();ctx.arc(x,y,.7+(i%4)*.35,0,Math.PI*2);ctx.fill()}
 }
 const g=ctx.createRadialGradient(0,0,1,0,0,max*.24);g.addColorStop(0,'#fff2dd');g.addColorStop(.22,'#ff9fc5aa');g.addColorStop(1,'#ff4c9300');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,max*.24,0,7);ctx.fill();
 ctx.restore();
}
function drawRose(t){
 const {w,h,cx,cy}=dims();
 const sway=Math.sin(t*.0012)*2.2;
 const stemTop=cy+42, stemBottom=Math.min(h*.83,cy+h*.48);
 // Curved green stem made from many luminous particles.
 for(let i=0;i<520;i++){
  const u=i/519, y=stemTop+u*(stemBottom-stemTop);
  const x=cx+sway+Math.sin(u*9.5)*5;
  const px=x+Math.sin(i*1.7+t*.0015)*1.2;
  const py=y+Math.cos(i*1.3+t*.0014)*1.1;
  ctx.fillStyle=i%9===0?'#c5ffd9':(i%3===0?'#a0ffbd':'#45e991');
  ctx.shadowBlur=mode==='dots'?10:0;ctx.shadowColor='#52ffad';
  if(mode==='ascii'){ctx.font='9px monospace';ctx.fillText(['%','^','0','1'][i%4],px,py)}
  else{ctx.beginPath();ctx.arc(px,py,.8+(i%3)*.28,0,Math.PI*2);ctx.fill()}
 }
 // Two delicate leaves.
 function leaf(side, yAt, angle){
  ctx.save();ctx.translate(cx+sway+Math.sin(yAt*.02)*5,yAt);ctx.rotate(angle*side);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(26, -23, 48, -3);
  ctx.quadraticCurveTo(27, 17, 0, 0);ctx.closePath();
  ctx.fillStyle='#239e65';ctx.shadowColor='#4dffad';ctx.shadowBlur=13;ctx.fill();
  ctx.strokeStyle='#a5ffd0';ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(23,-3,44,-3);
  ctx.strokeStyle='#baffd5';ctx.lineWidth=.8;ctx.stroke();ctx.restore();
 }
 leaf(-1,stemTop+100,-.35);leaf(1,stemTop+190,.32);

 // Rose head: concentric curled petals, shaped as a full layered bloom.
 const R=Math.min(w,h)*.205;
 ctx.save();ctx.translate(cx,cy);
 for(let layer=5;layer>=0;layer--){
  const count=layer===0?90:150;
  for(let i=0;i<count;i++){
   const a=i/count*Math.PI*2+layer*.31;
   const f=i/count;
   const radius=R*(.18+layer*.145)+Math.sin(a*5+layer)*R*.025;
   const px=Math.cos(a)*radius;
   const py=Math.sin(a)*radius*.83;
   const petalW=R*(.20-layer*.018), petalH=R*(.13-layer*.008);
   ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);
   const grad=ctx.createRadialGradient(0,-petalH*.25,1,0,0,petalW);
   const shades=['#ffb0ce','#ff6fa5','#f83b82','#d91f68'];
   grad.addColorStop(0,layer<2?'#ffd0df':shades[(i+layer)%shades.length]);
   grad.addColorStop(1,layer<2?'#e92e73':'#a91552');
   ctx.fillStyle=grad;ctx.shadowColor='#ff4c93';ctx.shadowBlur=mode==='dots'?10:2;
   ctx.beginPath();ctx.moveTo(0,petalH*.65);
   ctx.bezierCurveTo(-petalW*.95,-petalH*.05,-petalW*.7,-petalH*1.15,0,-petalH);
   ctx.bezierCurveTo(petalW*.7,-petalH*1.15,petalW*.95,-petalH*.05,0,petalH*.65);
   ctx.fill();ctx.restore();
  }
 }
 // Spiral heart of the rose.
 for(let i=0;i<230;i++){
  const a=i*.19+t*.00025,r=2+i*.105;
  const x=Math.cos(a)*r,y=Math.sin(a)*r*.82;
  ctx.fillStyle=i%5===0?'#fff0e5':(i%2?'#ff8eb8':'#ff3b82');
  ctx.shadowBlur=mode==='dots'?9:0;ctx.shadowColor='#ff7aaa';
  if(mode==='ascii'){ctx.font='8px monospace';ctx.fillText(['#','%','^','0','1'][i%5],x,y)}
  else{ctx.beginPath();ctx.arc(x,y,.8+(i%3)*.3,0,Math.PI*2);ctx.fill()}
 }
 ctx.restore();
 // AL-QAMIR signature, placed beside the bloom.
 ctx.save();ctx.textAlign='left';ctx.font='600 11px Arial';
 ctx.fillStyle='#f7d4e4';ctx.shadowColor='#ff62a0';ctx.shadowBlur=13;
 ctx.fillText('AL-QAMIR',cx+R*.78,cy+R*.18);
 ctx.font='8px Arial';ctx.fillStyle='#d8a9c0';ctx.fillText('A GIFT FROM THE HEART',cx+R*.78,cy+R*.18+15);
 ctx.restore();ctx.shadowBlur=0;
}
function animate(t){ctx.clearRect(0,0,fx.clientWidth,fx.clientHeight);drawStars(t);if(phase===1)drawGalaxy(t);if(phase===2)drawRose(t);raf=requestAnimationFrame(animate)}
function clearStages(){stageTimers.forEach(clearTimeout);stageTimers=[]}
function run(){
 clearStages();phase=0;
 $('envelope').classList.remove('show','open');$('scriptname').classList.remove('show');$('bottomname').classList.remove('show');
 const n=$('person').value.trim()||'Sen';$('scriptname').textContent=n;$('bottomname').textContent=n;
 stageTimers.push(setTimeout(()=>$('envelope').classList.add('show'),250));
 stageTimers.push(setTimeout(()=>$('envelope').classList.add('open'),1550));
 stageTimers.push(setTimeout(()=>{$('envelope').classList.remove('show');phase=1},2900));
 stageTimers.push(setTimeout(()=>$('scriptname').classList.add('show'),4700));
 stageTimers.push(setTimeout(()=>{$('scriptname').classList.remove('show');phase=2;$('bottomname').classList.add('show');$('brandMark').classList.add('show')},7900));
}
$('replay').addEventListener('click',run);
$('ascii').addEventListener('click',()=>{mode=mode==='dots'?'ascii':'dots';$('ascii').textContent=mode==='dots'?'✧ NUQTALAR':'# % ^ 0 1';$('ascii').classList.toggle('active',mode==='ascii')});
const bgMusic=$('bgMusic');
$('voice').addEventListener('click',async()=>{
 if(bgMusic.paused){try{await bgMusic.play();$('voice').textContent='♫ MUSIQA ON';$('voice').classList.add('active')}catch(e){$('voice').textContent='MUSIC.MP3 KERAK'}}else{bgMusic.pause();$('voice').textContent='♫ MUSIQA';$('voice').classList.remove('active')}
});
const panel=$('generatorPanel');
$('openGenerator').addEventListener('click',()=>{panel.classList.remove('hidden');$('genName').focus()});
$('closeGenerator').addEventListener('click',()=>panel.classList.add('hidden'));
panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.add('hidden')});
let selectedMode='dots';
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
 selectedMode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
}));
$('createLink').addEventListener('click',()=>{
 const n=$('genName').value.trim();if(!n){$('genName').focus();$('genName').style.borderColor='#ff6c91';return}
 const message=$('genMessage').value.trim();
 const url=new URL(window.location.href);url.search='';url.hash='';
 url.searchParams.set('name',n);if(message)url.searchParams.set('message',message);url.searchParams.set('mode',selectedMode);
 $('generatedUrl').value=url.toString();$('generatedWrap').classList.remove('hidden');$('copyStatus').textContent='Havolani nusxalab, Telegram yoki Instagram orqali yuboring.';
});
$('copyLink').addEventListener('click',async()=>{
 const field=$('generatedUrl');field.select();field.setSelectionRange(0,field.value.length);
 try{await navigator.clipboard.writeText(field.value);$('copyStatus').textContent='Havola nusxalandi! Endi yuborishingiz mumkin ✓'}
 catch(e){try{document.execCommand('copy');$('copyStatus').textContent='Havola nusxalandi! ✓'}catch(_){$('copyStatus').textContent='Havolani belgilang va Copy qiling.'}}
});
function loadPersonalLink(){
 const p=new URLSearchParams(location.search),n=p.get('name'),m=p.get('message'),mde=p.get('mode');
 if(n){$('genName').value=n}
 if(m){$('genMessage').value=m;$('personalMessage').textContent=m;$('personalMessage').classList.add('show')}
 if(mde==='ascii'){mode='ascii';selectedMode='ascii';$('ascii').textContent='# % ^ 0 1';$('ascii').classList.add('active')}
 if(n)run();
}
new ResizeObserver(sizeCanvas).observe($('scene'));window.addEventListener('resize',sizeCanvas);
sizeCanvas();loadPersonalLink();animate(0);
</script></body></html>
