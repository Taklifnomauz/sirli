<script>
const $ = id => document.getElementById(id);
const starCanvas=$('stars'), fx=$('fx'), sctx=starCanvas.getContext('2d'), ctx=fx.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1,mode='dots',phase=0,raf=0,stageTimers=[];
let stars=[],audioContext=null,oscillator=null,gainNode=null;
let flowerType='rose',flowerColor='pink',uiLang='uz';
const flowerPalettes={
 pink:['#ffe1ec','#ff8eb7','#ffd1e2','#b92768'],
 red:['#ffd0d0','#f04462','#ff9aab','#8f1738'],
 white:['#ffffff','#f4dce9','#fff7fb','#b9a7b5'],
 purple:['#f0d7ff','#b77be8','#dfb6ff','#63358e'],
 blue:['#d8f4ff','#75c9f2','#b4e8ff','#286d9c'],
 yellow:['#fff3b0','#ffc83d','#ffe78a','#b87916'],
 orange:['#ffe0c2','#ff9a62','#ffc49b','#a94b2b']
};
function sizeCanvas(){
 const rect=fx.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
 starCanvas.width=Math.round(W*dpr);starCanvas.height=Math.round(H*dpr);
 fx.width=Math.max(1,Math.round(rect.width*dpr));fx.height=Math.max(1,Math.round(rect.height*dpr));
 sctx.setTransform(dpr,0,0,dpr,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:260},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.6,p:Math.random()*6.28}));
}
function dims(){let r=fx.getBoundingClientRect();return {w:r.width,h:r.height,cx:r.width/2,cy:r.height*.43}}
function drawStars(t){sctx.clearRect(0,0,W,H);for(const p of stars){sctx.globalAlpha=.24+.62*(.5+.5*Math.sin(t*.001+p.p));sctx.fillStyle='#f0e5ff';sctx.beginPath();sctx.arc(p.x,p.y,p.r,0,Math.PI*2);sctx.fill()}sctx.globalAlpha=1}
function drawGalaxy(t){
 const {w,h,cx,cy}=dims(),max=Math.min(w,h)*.36;ctx.save();ctx.translate(cx,cy);
 // Multi-arm spiral with a dense luminous core.
 for(let i=0;i<1700;i++){
  const arm=i%5, u=Math.random; // deterministic positions below
  const q=i/1700, a=q*Math.PI*13+arm*Math.PI*2/5+t*.00022*(i%2?1:-1);
  const r=5+q*max, spread=(Math.sin(i*91.7)*.5)*9;
  const x=Math.cos(a)*(r+spread)*1.12,y=Math.sin(a)*(r+spread)*.56;
  const alpha=.25+.65*(.5+.5*Math.sin(i+t*.003));
  ctx.fillStyle=i%17===0?'#fff4df':(i%4===0?`rgba(255,174,209,${alpha})`:`rgba(255,62,139,${alpha})`);
  ctx.shadowBlur=mode==='dots'?11:0;ctx.shadowColor='#ff4c93';
  if(mode==='ascii'){ctx.font='10px monospace';ctx.fillText(['#','%','^','0','1','@'][i%6],x,y)}
  else{ctx.beginPath();ctx.arc(x,y,.7+(i%4)*.35,0,Math.PI*2);ctx.fill()}
 }
 const g=ctx.createRadialGradient(0,0,1,0,0,max*.24);g.addColorStop(0,'#fff2dd');g.addColorStop(.22,'#ff9fc5aa');g.addColorStop(1,'#ff4c9300');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,max*.24,0,7);ctx.fill();
 ctx.restore();
}
function drawRose(t){
 const {w,h,cx,cy}=dims(), sway=Math.sin(t*.00055)*2;
 const stemTop=cy+38,stemBottom=Math.min(h*.83,cy+h*.48);
 for(let i=0;i<520;i++){
  const u=i/519,y=stemTop+u*(stemBottom-stemTop),x=cx+sway+Math.sin(u*9.5)*5;
  const px=x+Math.sin(i*1.7+t*.0007)*1.2,py=y+Math.cos(i*1.3+t*.0007)*1.1;
  ctx.fillStyle=i%9===0?'#c5ffd9':(i%3===0?'#a0ffbd':'#45e991');
  if(mode==='ascii'){ctx.font='9px monospace';ctx.fillText(['%','^','0','1'][i%4],px,py)}
  else{ctx.beginPath();ctx.arc(px,py,.8+(i%3)*.28,0,Math.PI*2);ctx.fill()}
 }
 function leaf(side,y,ang){ctx.save();ctx.translate(cx+sway+Math.sin(y*.02)*5,y);ctx.rotate(ang*side);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(26,-23,48,-3);ctx.quadraticCurveTo(27,17,0,0);ctx.closePath();ctx.fillStyle='#239e65';ctx.shadowColor='#4dffad';ctx.shadowBlur=13;ctx.fill();ctx.strokeStyle='#baffd5';ctx.stroke();ctx.restore()}
 leaf(-1,stemTop+100,-.35);leaf(1,stemTop+190,.32);
 const R=Math.min(w,h)*.205,p=flowerPalettes[flowerColor]||flowerPalettes.pink;
 ctx.save();ctx.translate(cx,cy);
 const petals=flowerType==='sunflower'?18:(flowerType==='cherry'?5:(flowerType==='tulip'?7:12));
 const layers=flowerType==='cherry'?2:4;
 for(let layer=layers-1;layer>=0;layer--){
  for(let i=0;i<petals;i++){
   const a=i/petals*Math.PI*2+layer*.24+t*.000025;
   const radius=R*(.12+layer*.19),px=Math.cos(a)*radius,py=Math.sin(a)*radius*.82;
   const pw=R*(flowerType==='sunflower'?.16:(flowerType==='tulip'?.25:.22)),ph=R*(flowerType==='sunflower'?.28:.22);
   ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);
   const g=ctx.createLinearGradient(0,-ph,0,ph);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[3]);
   ctx.fillStyle=g;ctx.shadowColor=p[1];ctx.shadowBlur=mode==='dots'?13:2;
   ctx.beginPath();ctx.moveTo(0,ph*.7);
   if(flowerType==='tulip'){ctx.bezierCurveTo(-pw,-ph*.2,-pw*.7,-ph*1.4,0,-ph);ctx.bezierCurveTo(pw*.7,-ph*1.4,pw,-ph*.2,0,ph*.7)}
   else if(flowerType==='cherry'){ctx.bezierCurveTo(-pw*1.2,-ph*.1,-pw,-ph,0,-ph*.8);ctx.bezierCurveTo(pw,-ph,pw*1.2,-ph*.1,0,ph*.7)}
   else{ctx.bezierCurveTo(-pw,-ph*.1,-pw*.85,-ph*1.2,0,-ph);ctx.bezierCurveTo(pw*.85,-ph*1.2,pw,-ph*.1,0,ph*.7)}
   ctx.fill();ctx.restore();
  }
 }
 if(flowerType==='sunflower'){ctx.beginPath();ctx.arc(0,0,R*.23,0,Math.PI*2);ctx.fillStyle='#70421d';ctx.shadowColor='#ffcf55';ctx.shadowBlur=12;ctx.fill()}
 else{for(let i=0;i<80;i++){const a=i*2.4,r=Math.sqrt(i)*R*.018;ctx.fillStyle=i%2?'#fff3d7':p[2];ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,1.2,0,Math.PI*2);ctx.fill()}}
 ctx.restore();
 ctx.save();ctx.textAlign='left';ctx.font='600 11px Arial';ctx.fillStyle='#f7d4e4';ctx.shadowColor=p[1];ctx.shadowBlur=13;ctx.fillText('AL-QAMIR',cx+R*.78,cy+R*.18);ctx.restore();ctx.shadowBlur=0;
}
function animate(t){ctx.clearRect(0,0,fx.clientWidth,fx.clientHeight);drawStars(t);if(phase===1)drawGalaxy(t);if(phase===2)drawRose(t);raf=requestAnimationFrame(animate)}
function clearStages(){stageTimers.forEach(clearTimeout);stageTimers=[]}

  copy:'СКОПИРОВАТЬ ССЫЛКУ',copyHelp:'Скопируйте ссылку и отправьте через Telegram или Instagram.',
  copied:'Ссылка скопирована! Теперь можно отправить ✓',copyFallback:'Выделите ссылку и нажмите Copy.',
  defaultMessage:'Этот цветок именно для тебя ❤️'
 },
 en:{
  link:'✦ CREATE LINK',dots:'PARTICLES',music:'♫ MUSIC',musicOn:'♫ MUSIC ON',
  replay:'REPLAY',genTitle:'✦ CREATE A PERSONAL GIFT ✦',
  nameLabel:'Who is it for? Enter a name',namePlaceholder:'For example: Madina',
  messageLabel:'Your personal message',messagePlaceholder:'Write something from the heart...',
  modeLabel:'Animation style',flowerLabel:'Choose a flower',
  colorLabel:'Choose flower color',langLabel:'Choose language',
  create:'CREATE LINK ✦',ready:'YOUR PERSONAL LINK',
  copy:'COPY LINK',copyHelp:'Copy the link and send it via Telegram or Instagram.',
  copied:'Link copied! You can send it now ✓',copyFallback:'Select the link and press Copy.',
  defaultMessage:'This flower is just for you ❤️'
 }
};
function applyLanguage(){
 const t=translations[uiLang]||translations.uz;
 $('openGenerator').textContent=t.link;
 $('ascii').textContent=mode==='dots'?(uiLang==='uz'?'NUQTALAR':uiLang==='ru'?'ТОЧКИ':'PARTICLES'):'# % ^ 0 1';
 $('voice').textContent=bgMusic && !bgMusic.paused?t.musicOn:t.music;
 $('replay').textContent=t.replay;
 document.querySelector('.gen-title').textContent=t.genTitle;
 document.querySelector('label[for="genName"]').textContent=t.nameLabel;
 $('genName').placeholder=t.namePlaceholder;
 document.querySelector('label[for="genMessage"]').textContent=t.messageLabel;
 $('genMessage').placeholder=t.messagePlaceholder;
 document.querySelectorAll('.generator-card > label')[2].textContent=t.modeLabel;
 document.querySelector('label[for="genFlower"]').textContent=t.flowerLabel;
 document.querySelector('label[for="genColor"]').textContent=t.colorLabel;
 document.querySelector('label[for="genLang"]').textContent=t.langLabel;
 $('createLink').textContent=t.create;
 document.querySelector('.generated-caption').textContent=t.ready;
 $('copyLink').textContent=t.copy;
 if(!$('copyStatus').dataset.changed) $('copyStatus').textContent=t.copyHelp;
}

function run(){
 clearStages();
 phase=0;
 $('envelope').classList.remove('show','open');
 $('scriptname').classList.remove('show');
 $('bottomname').classList.remove('show');
 $('brandMark').classList.remove('show');
 const params=new URLSearchParams(location.search);
 const n=(params.get('name')||'Madina').trim()||'Madina';
 $('scriptname').textContent=n;
 $('bottomname').textContent=n;
 stageTimers.push(setTimeout(()=>$('envelope').classList.add('show'),300));
 stageTimers.push(setTimeout(()=>$('envelope').classList.add('open'),2300));
 stageTimers.push(setTimeout(()=>{$('envelope').classList.remove('show');phase=1},4200));
 stageTimers.push(setTimeout(()=>$('scriptname').classList.add('show'),5200));
 stageTimers.push(setTimeout(()=>{
  $('scriptname').classList.remove('show');
  phase=2;
  $('bottomname').classList.add('show');
  $('brandMark').classList.add('show');
 },10800));
}
$('replay').addEventListener('click',run);
$('ascii').addEventListener('click',()=>{mode=mode==='dots'?'ascii':'dots';$('ascii').textContent=mode==='dots'?'✧ NUQTALAR':'# % ^ 0 1';$('ascii').classList.toggle('active',mode==='ascii');applyLanguage()});
const bgMusic=$('bgMusic');
$('voice').addEventListener('click',async()=>{
 if(bgMusic.paused){try{await bgMusic.play();$('voice').textContent=(translations[uiLang]||translations.uz).musicOn;$('voice').classList.add('active')}catch(e){$('voice').textContent='MUSIC.MP3 KERAK'}}else{bgMusic.pause();$('voice').textContent=(translations[uiLang]||translations.uz).music;$('voice').classList.remove('active')}
});
const panel=$('generatorPanel');
$('openGenerator').addEventListener('click',()=>{panel.classList.remove('hidden');$('genName').focus()});
$('closeGenerator').addEventListener('click',()=>panel.classList.add('hidden'));
panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.add('hidden')});
let selectedMode='dots';
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
 selectedMode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
}));
$('genFlower').addEventListener('change',e=>{flowerType=e.target.value});
$('genColor').addEventListener('change',e=>{flowerColor=e.target.value});
$('genLang').addEventListener('change',e=>{uiLang=e.target.value;applyLanguage()});
$('createLink').addEventListener('click',()=>{
 const n=$('genName').value.trim();if(!n){$('genName').focus();$('genName').style.borderColor='#ff6c91';return}
 const message=$('genMessage').value.trim();
 const url=new URL(window.location.href);url.search='';url.hash='';
 url.searchParams.set('name',n);if(message)url.searchParams.set('message',message);url.searchParams.set('mode',selectedMode);
  url.searchParams.set('flower',$('genFlower').value);
  url.searchParams.set('color',$('genColor').value);
  url.searchParams.set('lang',$('genLang').value);
 $('generatedUrl').value=url.toString();$('generatedWrap').classList.remove('hidden');$('copyStatus').dataset.changed='';$('copyStatus').textContent=(translations[uiLang]||translations.uz).copyHelp;
});
$('copyLink').addEventListener('click',async()=>{
 const field=$('generatedUrl');field.select();field.setSelectionRange(0,field.value.length);
 try{await navigator.clipboard.writeText(field.value);$('copyStatus').dataset.changed='1';$('copyStatus').textContent=(translations[uiLang]||translations.uz).copied}
 catch(e){try{document.execCommand('copy');$('copyStatus').dataset.changed='1';$('copyStatus').textContent=(translations[uiLang]||translations.uz).copied}catch(_){$('copyStatus').dataset.changed='1';$('copyStatus').textContent=(translations[uiLang]||translations.uz).copyFallback}}
});
function loadPersonalLink(){
 const p=new URLSearchParams(location.search);
 const n=(p.get('name')||'Madina').trim()||'Madina';
 const m=p.get('message'),mde=p.get('mode');
  flowerType=p.get('flower')||'rose';
  flowerColor=p.get('color')||'pink';
  uiLang=p.get('lang')||'uz';
  if(!flowerPalettes[flowerColor])flowerColor='pink';
  if(!['rose','tulip','sunflower','cherry','lily'].includes(flowerType))flowerType='rose';
  if(!['uz','ru','en'].includes(uiLang))uiLang='uz';
  applyLanguage();
  $('genFlower').value=flowerType;
  $('genColor').value=flowerColor;
  $('genLang').value=uiLang;
 $('genName').value=n;
 if(m){$('genMessage').value=m;$('personalMessage').textContent=m;$('personalMessage').classList.add('show')}
  else $('genMessage').value=(translations[uiLang]||translations.uz).defaultMessage;
 if(mde==='ascii'){mode='ascii';selectedMode='ascii';$('ascii').textContent='# % ^ 0 1';$('ascii').classList.add('active')}
 // Sahifa ochilishi bilan animatsiya avtomatik boshlanadi.
 run();
}
new ResizeObserver(sizeCanvas).observe($('scene'));window.addEventListener('resize',sizeCanvas);
sizeCanvas();loadPersonalLink();animate(0);
</script></body></html>
